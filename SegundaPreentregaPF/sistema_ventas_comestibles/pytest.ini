[tool:pytest]
# Configuración de pytest para el proyecto

# Directorios donde buscar pruebas
testpaths = tests

# Patrones de archivos de prueba
python_files = test_*.py *_test.py

# Patrones de clases de prueba
python_classes = Test*

# Patrones de funciones de prueba
python_functions = test_*

# Opciones por defecto
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10

# Marcadores personalizados
markers =
    slow: marca las pruebas como lentas (deshabilitado por defecto)
    integration: marca las pruebas de integración
    unit: marca las pruebas unitarias
    patterns: marca las pruebas de patrones de diseño
    database: marca las pruebas que requieren base de datos

# Configuración de logging durante las pruebas
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filtros de warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

# Directorio temporal para pruebas
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"

# Configuración de coverage (si se usa pytest-cov)
# Descomentar si instalas pytest-cov
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Configuración mínima de Python
minversion = 3.8